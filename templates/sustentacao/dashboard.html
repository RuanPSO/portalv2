{% extends "sustentacao/index.html" %}
{% block title %}Grupos de Hosts{% endblock %}

{% block content %}

<h1 class="text-2xl font-bold mb-6">Grupos de Hosts</h1>

<div id="gruposContainer"
     class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
</div>

<script>
async function carregarGrupos() {
  const res = await fetch("/grupos");
  const grupos = await res.json();

  const container = document.getElementById("gruposContainer");
  container.innerHTML = "";

  grupos.forEach(g => {
    container.innerHTML += `
      <a href="/hosts/grupo/${g.grupo}"
        class="block bg-white p-4 rounded shadow hover:bg-gray-50 transition"
        data-search="${g.grupo.toLowerCase()}">

        <p class="text-gray-500 text-sm">Grupo</p>
        <p class="text-lg font-bold">${g.grupo}</p>
        <p class="text-sm text-gray-400">${g.hosts.length} hosts</p>

      </a>
    `;
  });
}

carregarGrupos();
</script>

{% endblock %}
