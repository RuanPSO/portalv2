{% extends "index.html" %}

{% block content %}

<div class="p-6 bg-gray-100 min-h-screen">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">
            Dashboard de Monitoramento
        </h1>
        <p class="text-sm text-gray-500">
        </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-5 gap-5 mb-8">

        <!-- Incidentes -->
        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-blue-500">
            <p class="text-gray-500 text-sm">Incidentes Hoje</p>
            <h2 id="card-incidentes" class="text-3xl font-bold text-blue-600 mt-2">
                0
            </h2>
        </div>

        <!-- Online -->
        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-green-500">
            <p class="text-gray-500 text-sm">Hosts Online</p>
            <h2 id="card-online" class="text-3xl font-bold text-green-600 mt-2">
                0
            </h2>
        </div>

        <!-- Offline -->
        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-red-500">
            <p class="text-gray-500 text-sm">Hosts Offline</p>
            <h2 id="card-offline" class="text-3xl font-bold text-red-600 mt-2">
                0
            </h2>
        </div>

         <!-- Manutenção -->
        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-purple-500">
            <p class="text-gray-500 text-sm">Hosts em Manutenção</p>
            <h2 id="card-maintenance" class="text-3xl font-bold text-purple-600 mt-2">
                0
            </h2>
        </div>       

        <!-- Sem Acesso -->
        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-yellow-500">
            <p class="text-gray-500 text-sm">Hosts sem Acesso</p>
            <h2 id="card-sem-acesso" class="text-3xl font-bold text-yellow-500 mt-2">
                0
            </h2>
        </div>

    </div>

    <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-lg font-semibold mb-6">
            Problemas nas últimas 24 horas
        </h2>

        <div id="lista-problemas" class="space-y-3"></div>
    </div>

    <script>
        function carregarDashboard() {
            fetch("/api/moni")
                .then(response => response.json())
                .then(data => {

                    const online = document.getElementById("card-online");
                    const offline = document.getElementById("card-offline");
                    const semAcesso = document.getElementById("card-sem-acesso");
                    const Manutencao = document.getElementById("card-maintenance")
                    const incidentes = document.getElementById("card-incidentes");

                    if (online) online.innerText = data.online;
                    if (offline) offline.innerText = data.offline;
                    if (semAcesso) semAcesso.innerText = data.sem_acesso;
                    if (Manutencao) Manutencao.innerText = data.manutencao;
                    if (incidentes) incidentes.innerText = data.total_incidentes;

                })
                .catch(error => {
                    console.error("Erro ao carregar dashboard:", error);
                });
        }

    // Carrega quando abrir a página
    carregarDashboard();

    // Atualiza a cada 30 segundos
    setInterval(carregarDashboard, 30000);
    </script>


    <script>
    async function carregarProblemas() {
        const response = await fetch("/api/problemas-24h");
        const dados = await response.json();

        const container = document.getElementById("lista-problemas");
        container.innerHTML = "";

        dados.forEach(item => {

            const row = document.createElement("div");

            row.className = "flex justify-between items-center text-sm border-b pb-2";

            row.innerHTML = `
                <span class="truncate w-2/3">
                    ${item.problema}
                </span>

                <div class="flex gap-6 text-right">
                    <span class="font-semibold text-gray-700">
                        ${item.porcentagem}%
                    </span>
                </div>
            `;

            container.appendChild(row);
        });
    }

    carregarProblemas();
    setInterval(carregarProblemas, 75000);
    </script>

</div>


{% endblock %}
