<style>
/* ── host list scroll ── */
#host-list-container {
  max-height: 220px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: #d1d5db transparent;
  
}
#host-list-container::-webkit-scrollbar { width: 4px; }
#host-list-container::-webkit-scrollbar-thumb { background:#d1d5db; border-radius:2px;}

/* ── chart card na tela ── */
.chart-card {
  background: #1a1a2e;
  border-radius: 10px;
  padding: 18px 20px 14px;
}
.chart-card-title {
  color: #a0aec0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  margin: 0 0 10px;
  text-align: center;
}
.chart-legend {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 10px;
  color: #718096;
}

/* ══════════════════════════════════════════════
   #print-area — invisível na tela
══════════════════════════════════════════════ */
#print-area { display: none; }

/* ══════════════════════════════════════════════
   IMPRESSÃO
══════════════════════════════════════════════ */
@media print {

  /* Esconde TUDO */
  body > * { display: none !important; }

  /* Só mostra o print-area */
  body > #print-area {
    display: block !important;
    position: static !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    background: white !important;
  }

  html, body {
    margin: 0 !important;
    padding: 0 !important;
  }

  .rp-page {
    width: 210mm;
    min-height: 297mm;
    max-height: 297mm;
    box-sizing: border-box;
    overflow: hidden;
    page-break-after: always;
    page-break-inside: avoid;
    break-after: page;
    break-inside: avoid;
    position: relative;
  }
  .rp-page:last-child {
    page-break-after: avoid;
    break-after: avoid;
  }

  .rp-page-capa {
    background: #1a1a2e !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .rp-chart-card {
    background: #ffffff !important;
    border: 1px solid #e5e7eb !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  .rp-chart-card p { color: #1f2937 !important; }

  .rp-sum-card-min  { background: #f0fdf4 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .rp-sum-card-avg  { background: #eff6ff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .rp-sum-card-max  { background: #fef2f2 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .rp-sum-card-wrap { background: #fafafa !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .rp-header-band   { background: #0a466b !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  @page {
    margin: 0;
    size: A4 portrait;
  }

  .rp-sum-cards-container {
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
  }
  .rp-sum-card-wrap {
    width: 100% !important;
    max-width: 100% !important;
    flex: none !important;
  }
}
</style>

<!-- ════════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════ -->
<script>
/* ── estado global ──────────────────────────── */
let reportData   = [];
let grupoNome    = '';
let periodoLabel = '';
const screenCharts = {};
const printCharts  = [];
let _pendingPrintCharts = [];

/* ── utilitários ────────────────────────────── */
const pad = n => String(n).padStart(2,'0');

function fmtDTLocal(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDTParam(v){ return v.replace('T',' ') + ':00'; }
function fmtDTDisplay(v){
  if(!v) return '—';
  const s = v.replace('T',' ');
  const [date='', time=''] = s.split(' ');
  const [y,m,d] = date.split('-');
  return `${d}/${m}/${y} ${time.slice(0,5)}`;
}
function fmtLabel(s){
  if(!s) return '';
  const str = String(s).replace('T',' ');
  const [dp='', tp=''] = str.split(' ');
  const p = dp.split('-');
  if(p.length < 3) return str;
  return `${p[2]}/${p[1]} ${tp.slice(0,5)}`;
}
function decimate(labels, max){
  if(labels.length <= max) return labels;
  const step = Math.ceil(labels.length / max);
  return labels.map((l,i) => i % step === 0 ? l : '');
}
function killCharts(map){
  Object.values(map).forEach(c => { try{ c.destroy(); }catch(e){} });
  Object.keys(map).forEach(k => delete map[k]);
}
function waitFrames(n){
  return new Promise(resolve => {
    let count = 0;
    function tick(){ if(++count >= n) resolve(); else requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  });
}

/* ── visibilidade ───────────────────────────── */
function showSec(id){
  ['sec-empty','sec-loading','sec-report'].forEach(x => {
    const el = document.getElementById(x);
    el.classList.add('hidden');
    el.classList.remove('flex');
  });
  const t = document.getElementById(id);
  t.classList.remove('hidden');
  t.classList.add('flex');
}

/* ── período padrão ─────────────────────────── */
function setPeriod(h){
  const now = new Date(), ini = new Date(now - h*3600*1000);
  document.getElementById('dt-fim').value    = fmtDTLocal(now);
  document.getElementById('dt-inicio').value = fmtDTLocal(ini);
  document.querySelectorAll('.qbtn').forEach(b => {
    const on = parseInt(b.dataset.h) === h;
    b.classList.toggle('bg-[#0a466b]',    on);
    b.classList.toggle('text-white',       on);
    b.classList.toggle('border-[#0a466b]', on);
    b.classList.toggle('text-gray-600',   !on);
    b.classList.toggle('border-gray-300', !on);
  });
}
setPeriod(24);
document.querySelectorAll('.qbtn').forEach(b =>
  b.addEventListener('click', () => setPeriod(parseInt(b.dataset.h))));
['dt-inicio','dt-fim'].forEach(id =>
  document.getElementById(id).addEventListener('change', checkBtn));

/* ── habilitar gerar ────────────────────────── */
function checkBtn(){
  const checked = document.querySelectorAll('.host-chk:checked').length;
  const dates   = !!document.getElementById('dt-inicio').value
               && !!document.getElementById('dt-fim').value;
  document.getElementById('btn-gerar').disabled = !(checked > 0 && dates);
}

/* ── carregar hosts ── */
let currentRequest = null;

document.getElementById('sel-grupo').addEventListener('change', async function(){
  const gid  = this.value;
  const nome = this.options[this.selectedIndex]?.text || '';
  grupoNome  = gid ? nome : '';

  const cont  = document.getElementById('host-list-container');
  const label = document.getElementById('label-todos');
  const chkT  = document.getElementById('chk-todos');

  if(currentRequest){ currentRequest.abort(); }
  const controller = new AbortController();
  currentRequest = controller;

  chkT.checked = false; chkT.indeterminate = false;
  label.classList.add('hidden'); label.classList.remove('flex');
  cont.innerHTML = '';

  function mkPh(txt){
    const p = document.createElement('p');
    p.className = 'text-xs text-gray-400 italic';
    p.textContent = txt;
    return p;
  }
  cont.appendChild(mkPh(gid ? 'Carregando…' : 'Selecione um grupo primeiro.'));
  checkBtn();
  if(!gid) return;

  try {
    const r = await fetch(`/api/relatorio/hosts/${gid}`, { signal: controller.signal });
    if(!r.ok) throw new Error('HTTP error');
    const hosts = await r.json();
    if(currentRequest !== controller) return;
    cont.innerHTML = '';

    if(!hosts?.length){
      cont.appendChild(mkPh('Nenhum host disponível.'));
      checkBtn(); return;
    }

    hosts.forEach(h => {
      const lbl = document.createElement('label');
      lbl.className = 'flex items-center gap-2 text-xs text-gray-700 cursor-pointer py-1 px-1 rounded hover:bg-white transition';
      lbl.innerHTML = `<input type="checkbox" class="host-chk accent-[#0a466b] flex-shrink-0"
             data-hostid="${h.hostid}" data-hostname="${h.host}" />
        <span class="truncate">${h.host}</span>`;
      lbl.querySelector('input').addEventListener('change', () => {
        const total   = cont.querySelectorAll('.host-chk').length;
        const checked = cont.querySelectorAll('.host-chk:checked').length;
        chkT.checked       = (checked === total && total > 0);
        chkT.indeterminate = (checked > 0 && checked < total);
        checkBtn();
      });
      cont.appendChild(lbl);
    });

    label.classList.remove('hidden'); label.classList.add('flex');
    checkBtn();

  } catch(e){
    if(e.name === 'AbortError') return;
    cont.innerHTML = '';
    cont.appendChild(mkPh('Erro ao carregar hosts.'));
    console.error(e);
  }
});

document.getElementById('chk-todos').addEventListener('change', function(){
  document.querySelectorAll('.host-chk').forEach(c => c.checked = this.checked);
  checkBtn();
});

document.getElementById('btn-limpar').addEventListener('click', () => {
  document.getElementById('sel-grupo').value = '';
  grupoNome = '';
  const cont  = document.getElementById('host-list-container');
  const label = document.getElementById('label-todos');
  const chkT  = document.getElementById('chk-todos');
  chkT.checked = false; chkT.indeterminate = false;
  label.classList.add('hidden'); label.classList.remove('flex');
  cont.innerHTML = '';
  const p = document.createElement('p');
  p.className = 'text-xs text-gray-400 italic';
  p.textContent = 'Selecione um grupo primeiro.';
  cont.appendChild(p);
  setPeriod(24);
  killCharts(screenCharts);
  document.getElementById('sec-report').innerHTML = '';
  document.getElementById('btn-imprimir').disabled = true;
  showSec('sec-empty');
  checkBtn();
});

/* ════════════════════════════════════════════
   GERAR RELATÓRIO
════════════════════════════════════════════ */
document.getElementById('btn-gerar').addEventListener('click', async () => {
  const checks  = [...document.querySelectorAll('.host-chk:checked')];
  const inicio  = fmtDTParam(document.getElementById('dt-inicio').value);
  const fim     = fmtDTParam(document.getElementById('dt-fim').value);
  const agrup   = document.querySelector('input[name="agrupamento"]:checked').value;
  periodoLabel  = `${fmtDTDisplay(inicio)} — ${fmtDTDisplay(fim)}`;

  killCharts(screenCharts);
  document.getElementById('sec-report').innerHTML = '';
  showSec('sec-loading');
  document.getElementById('loading-msg').textContent = `Carregando ${checks.length} host(s)…`;

  try {
    const promises = checks.map(async c => {
      const hostid   = c.dataset.hostid;
      const hostname = c.dataset.hostname;
      const params   = new URLSearchParams({ inicio, fim, agrupamento: agrup });
      const r = await fetch(`/api/relatorio/inteligente/${hostid}?${params}`);
      if(!r.ok) throw new Error(`Erro HTTP ${r.status} para host ${hostname}`);
      const json = await r.json();
      return { hostid, hostname, dados: json.dados };
    });

    reportData = await Promise.all(promises);
    buildScreen(reportData);
    showSec('sec-report');
    requestAnimationFrame(() => drawScreenCharts(reportData));
    document.getElementById('btn-imprimir').disabled = false;

  } catch(e){
    showSec('sec-empty');
    console.error(e);
    alert('Erro ao carregar dados: ' + e.message);
  }
});

/* ════════════════════════════════════════════
   IMPRIMIR
   Ordem obrigatória:
   1. buildPrintArea()  → HTML + canvas vazios
   2. Pré-carrega imagem da capa
   3. Move #print-area para body e torna VISÍVEL  ← canvas ganham dimensões aqui
   4. waitFrames(8)     → browser calcula layout
   5. renderPrintCharts() → Chart.js desenha com dimensões reais
   6. waitFrames(6)     → Chart.js termina
   7. window.print()
════════════════════════════════════════════ */
document.getElementById('btn-imprimir').addEventListener('click', async () => {
  const btn = document.getElementById('btn-imprimir');
  btn.disabled = true;
  btn.textContent = 'Preparando…';

  const printArea = document.getElementById('print-area');

  /* 1. Constrói HTML (canvas ainda sem dimensões) */
  buildPrintArea();

  /* 2. Pré-carrega imagem da capa */
  await new Promise(resolve => {
    const capaImg = printArea.querySelector('.rp-capa-img');
    if (!capaImg) { resolve(); return; }
    if (capaImg.complete && capaImg.naturalHeight !== 0) { resolve(); return; }
    capaImg.onload  = resolve;
    capaImg.onerror = resolve;
  });

  /* 3. Move para body e exibe — ANTES de renderizar charts
     Somente após esta etapa os canvas têm offsetWidth/Height reais */
  document.body.appendChild(printArea);
  printArea.style.display = 'block';

  /* 4. Browser calcula layout → canvas ganham dimensões */
  await waitFrames(8);

  /* 5. Renderiza charts com dimensões reais */
  renderPrintCharts();

  /* 6. Chart.js termina de desenhar */
  await waitFrames(6);

  /* 7. Imprime */
  window.print();

  btn.disabled = false;
  btn.textContent = 'Imprimir / PDF';
});

window.addEventListener('afterprint', () => {
  const printArea = document.getElementById('print-area');

  printCharts.forEach(c => { try{ c.destroy(); }catch(e){} });
  printCharts.length = 0;

  printArea.innerHTML = '';
  printArea.style.display = 'none';

  const appUI = document.getElementById('app-ui');
  if (appUI && appUI.parentNode) {
    appUI.parentNode.insertBefore(printArea, appUI.nextSibling);
  }
});

/* ════════════════════════════════════════════
   CONFIGURAÇÃO DOS GRÁFICOS
════════════════════════════════════════════ */
const CHARTS_DEF = {
  cpu:            { title:'CPU',            unit:'%', color:'#38bdf8', fill:'rgba(56,189,248,0.35)'},
  memoria:        { title:'Memória RAM',    unit:'%', color:'#facc15', fill:'rgba(250,204,21,0.35)'},
  disponibilidade:{ title:'Disponibilidade',unit:'%', color:'#4ade80', fill:'rgba(74,222,128,0.35)'},
};
const DISCO_COLORS = [
  { color:'#34d399', fill:'rgba(52,211,153,0.35)'  },
  { color:'#f472b6', fill:'rgba(244,114,182,0.35)' },
  { color:'#fb923c', fill:'rgba(251,146,60,0.35)'  },
  { color:'#a78bfa', fill:'rgba(167,139,250,0.35)' },
  { color:'#22d3ee', fill:'rgba(34,211,238,0.35)'  },
];

/* ════════════════════════════════════════════
   SÉRIES E STATS
════════════════════════════════════════════ */
function buildSeriesFromIntelligente(pontos, isDisp){
  return pontos.map(p => {
    // 🔥 PRIORIDADE: valor real
    const raw =
      p.value ??   // ← melhor opção (se existir)
      p.last  ??   // ← comum em APIs
      p.max;       // fallback

    const v = parseFloat(p.value ?? p.last ?? p.max);

    return isDisp
      ? +(v * 100).toFixed(2)
      : +v.toFixed(2);
  });
}

function buildStats(values){
  if(!values.length) return { min:'—', avg:'—', max:'—', last:'—' };
  const clean = values.filter(v => v != null && !isNaN(v));
  if(!clean.length) return { min:'—', avg:'—', max:'—', last:'—' };
  return {
    min:  Math.min(...clean).toFixed(2),
    avg:  (clean.reduce((a,b)=>a+b,0)/clean.length).toFixed(2),
    max:  Math.max(...clean).toFixed(2),
    last: clean[clean.length-1].toFixed(2),
  };
}

/* ════════════════════════════════════════════
   CRIAR CHART
════════════════════════════════════════════ */
function makeChart(canvas, cfg, rawLabels, tickLabels, values, forPrint, extraDatasets){
  const ctx = canvas.getContext('2d');
  const h   = canvas.offsetHeight || 260;

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, cfg.fill);
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  const datasets = [{
    label: cfg.title,
    data: values,
    borderColor: cfg.color,
    backgroundColor: grad,
    borderWidth: 2,
    pointRadius: 0,
    tension: 0.3,
    fill: true,
  }];

  if(extraDatasets) datasets.push(...extraDatasets);

  return new Chart(ctx, {
    type: 'line',
    data: { labels: tickLabels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => rawLabels[items[0].dataIndex] || '',
            label: ctx  => ` ${ctx.dataset.label}: ${ctx.parsed.y}${cfg.unit}`,
          }
        }
      },
      scales: {
        x: {
          type: 'category',
          ticks: {
            color: forPrint ? '#6b7280' : '#4a5568',
            maxRotation: 0,
            font: { size: forPrint ? 7 : 9 },
            callback: function(val){ return this.getLabelForValue(val) || null; }
          },
          grid: { color: forPrint ? 'rgba(0,0,0,0.07)' : 'rgba(255,255,255,0.04)' },
          border: { display: false },
        },
        y: {
          beginAtZero: true,
          suggestedMax: Math.max(...values) * 1.1, // 🔥 margem automática
          ticks: {
            color: forPrint ? '#6b7280' : '#4a5568',
            font: { size: forPrint ? 7 : 9 },
            callback: v => v + cfg.unit
          },
          grid: { color: forPrint ? 'rgba(0,0,0,0.07)' : 'rgba(255,255,255,0.06)' },
          border: { display: false },
          ...(cfg.ymax ? { max: cfg.ymax } : {})
        }
      }
    }
  });
}

/* ════════════════════════════════════════════

════════════════════════════════════════════ */
function drawScreenCharts(data){
  data.forEach((item, idx) => {
    const d          = item.dados;
    const discos     = d.discos || {};
    const discosKeys = Object.keys(discos);

    const chartsOrder = [
      { key:'cpu',    cfg:CHARTS_DEF.cpu,    pontos: d.cpu    || [], isDisp:false },
      { key:'memoria',cfg:CHARTS_DEF.memoria,pontos: d.memoria|| [], isDisp:false },
    ];
    discosKeys.forEach((mount, i) => {
      const dc = DISCO_COLORS[i % DISCO_COLORS.length];
      chartsOrder.push({
        key:    `disco_${i}`,
        cfg:    { title:`Disco ${mount}`, unit:'%', color:dc.color, fill:dc.fill },
        pontos: discos[mount] || [],
        isDisp: false,
        mount,
      });
    });
    chartsOrder.push({ key:'disponibilidade', cfg:CHARTS_DEF.disponibilidade, pontos: d.disponibilidade||[], isDisp:true });

    chartsOrder.forEach(ch => {
      const cid    = `sc-${idx}-${ch.key}`;
      const canvas = document.getElementById(cid);
      if(!canvas) return;

      if(!ch.pontos.length){
        canvas.closest('div[style*="position"]').innerHTML =
          `<div style="display:flex;align-items:center;justify-content:center;height:260px;
                       border:1px dashed #2d3748;border-radius:6px;color:#4a5568;font-size:12px">
            Sem dados no período
          </div>`;
        return;
      }
 
      const rawLabels  = ch.pontos.map(p => fmtLabel(p.data));
      const tickLabels = decimate(rawLabels, 14);
      const values     = buildSeriesFromIntelligente(ch.pontos, ch.isDisp);
      const stats      = buildStats(values);
 
      if(screenCharts[cid]) screenCharts[cid].destroy();
      screenCharts[cid] = makeChart(canvas, ch.cfg, rawLabels, tickLabels, values, false);
 
      const leg = document.getElementById(`leg-${idx}-${ch.key}`);
      if(leg) leg.innerHTML = `
        <span style="display:flex;align-items:center;gap:4px">
          <span style="width:10px;height:10px;border-radius:2px;background:${ch.cfg.color}"></span>
          ${ch.cfg.title} (média)
        </span>
        <span>último: <b style="color:${ch.cfg.color}">${stats.last}${ch.cfg.unit}</b></span>
        <span>mín: <b>${stats.min}${ch.cfg.unit}</b></span>
        <span>méd: <b>${stats.avg}${ch.cfg.unit}</b></span>
        <span>máx: <b>${stats.max}${ch.cfg.unit}</b></span>`;
    });
  });
}

                    display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
          <p style="font-size:7pt;color:#9ca3af;margin:0;">SPS Group — Relatório gerado </p>
          <p style="font-size:7pt;color:#9ca3af;margin:0;">Host ${idx+1} de ${reportData.length}</p>
        </div>
      </div>`);

    /* Registra para renderização posterior */
    pChartsOrder.forEach(ch => {
      if(!ch.pontos.length) return;
      _pendingPrintCharts.push({ idx, ch });
    });
  });
}

/* ════════════════════════════════════════════
   RENDERIZA OS CHARTS DE IMPRESSÃO
   Chamado APÓS #print-area estar visível no body,
   garantindo canvas.offsetWidth/offsetHeight reais.
════════════════════════════════════════════ */
function renderPrintCharts(){
  _pendingPrintCharts.forEach(({ idx, ch }) => {
    const pid    = `pc-${idx}-${ch.key}`;
    const canvas = document.getElementById(pid);
    if(!canvas) return;

    const container = canvas.parentElement;
    if(!container) return;

    /* Força dimensões explícitas — essencial para Chart.js no contexto de impressão */
    const w = container.offsetWidth  || 600;
    const h = container.offsetHeight || 200;
    canvas.width        = w;
    canvas.height       = h;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';

    const rawLabels  = ch.pontos.map(p => fmtLabel(p.data));
    const tickLabels = decimate(rawLabels, 10);
    const values     = buildSeriesFromIntelligente(ch.pontos, ch.isDisp);
    const stats      = buildStats(values);

    const chart = makeChart(canvas, ch.cfg, rawLabels, tickLabels, values, true);
    printCharts.push(chart);

    const leg = document.getElementById(`pleg-${idx}-${ch.key}`);
    if(leg) leg.innerHTML = `
      <span style="display:flex;align-items:center;gap:4px;">
        <span style="width:8px;height:8px;border-radius:2px;background:${ch.cfg.color};"></span>
        ${ch.cfg.title}
      </span>
      <span>mín: <b>${stats.min}${ch.cfg.unit}</b></span>
      <span>méd: <b>${stats.avg}${ch.cfg.unit}</b></span>
      <span>máx: <b>${stats.max}${ch.cfg.unit}</b></span>`;
  });
}
</script>
