<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
@page {
  size: A4;
  margin: 0;
}

body {
  font-family: Arial;
  margin: 0;
}

.page {
  width: 210mm;
  height: 297mm;
  page-break-after: always;
  padding: 20mm;
  box-sizing: border-box;
}

</style>
</head>

<body>

{% for host in dados %}
<div class="page">

  <h2>{{ host.metricas.host }}</h2>
  <p>Período: {{ inicio }} até {{ fim }}</p>

  <h3>CPU</h3>
  <p>Mín: {{ host.periodo.cpu.min }}</p>
  <p>Méd: {{ host.periodo.cpu.avg }}</p>
  <p>Máx: {{ host.periodo.cpu.max }}</p>

</div>
{% endfor %}

<script>
window.onload = () => {
  setTimeout(() => {
    window.print();

    // 🔥 fecha automaticamente depois
    setTimeout(() => {
      window.close();
    }, 500);

  }, 800);
};
</script>

</body>
</html>
